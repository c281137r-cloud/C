# config.toml にコピーして自分用に書き換えてください（config.toml は git に入りません）

[player]
# コーチに伝えるプロフィール。空欄の項目は送られません。
"プラットフォーム" = "PS5（パッド）"
"ランク" = "ゴールド"
"よく使うレジェンド" = "オクタン, ブラッドハウンド"
"プレイモード" = "ランク / トリオ"
"感度設定" = ""
"今の悩み" = "撃ち合いで負けることが多い。漁夫に弱い"

[coach]
model = "claude-opus-5-5"
effort = "high"        # low / medium / high / xhigh / max（高いほど丁寧・高コスト）
interval = 2.0         # 何秒ごとに1枚切り出すか（小さいほど細かいが高コスト）
width = 1280           # 画像の横幅。HUD を読むため 1280 推奨、節約するなら 960
max_frames = 400       # 1本あたりの上限枚数（長い動画は自動で間隔を広げる）
chunk_size = 40
parallel = 3
